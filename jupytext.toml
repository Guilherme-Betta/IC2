# Pareamento notebooks <-> scripts com jupytext.
#
# Uma UNICA tabela [formats] (colchetes simples). Cada chave e um prefixo de
# pasta; o nome-base do arquivo e compartilhado entre os dois lados:
#   notebooks/X.ipynb  <->  src/pcj/X.py
#
# Por isso os notebooks ficam com nomes limpos (sem o prefixo numerico 0_, 1_...):
# 'import 0_utils' seria invalido em Python, entao o .py precisa ser 'utils.py'.
[formats]
"notebooks/" = "ipynb"
"src/pcj/" = "py:percent"
